version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_DB: forum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    env_file: .env
    depends_on: [db, redis, minio]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker -l info
    env_file: .env
    depends_on: [db, redis, minio]
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app

  bot:
      build: ./backend
      command: python -m app.bot
      env_file: .env
      depends_on: 
        - db
        - backend
      volumes:
        - ./backend:/app
      environment:
        # Используем SOCKS5 прокси (рекомендуется для Telegram)
        - ALL_PROXY=socks5://host.docker.internal:10808
        # Если SOCKS5 не работает, попробуй HTTP:
        # - HTTP_PROXY=http://host.docker.internal:10809
        # - HTTPS_PROXY=http://host.docker.internal:10809

volumes:
  pgdata:
  miniodata: